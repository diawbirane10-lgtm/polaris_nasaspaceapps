<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">POLARIS lunar mission patch</title>
<desc id="desc">Original POLARIS insignia featuring a cratered lunar horizon, orbit line, satellite and guiding star, without NASA insignia.</desc>
