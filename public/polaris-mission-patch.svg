 <clipPath id="disc"><circle cx="128" cy="128" r="104"/></clipPath>
 <path id="top-arc" d="M 38 131 A 90 90 0 0 1 218 131"/>
 <path id="bottom-arc" d="M 37 145 A 91 91 0 0 0 219 145"/>
