name: POLARIS tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and test dependencies
        run: python -m pip install -r requirements.txt pytest httpx beautifulsoup4
      - name: Run all tests
        run: python -m pytest -q
